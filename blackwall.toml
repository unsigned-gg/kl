# Blackwall build-pipeline custody config for unsigned-gg/kl.
# Custody chain: run -> settle -> reconcile -> verify -> PR -> merge-gate.

[defaults]
provider = "gateway"
model = "kimi-k3"

[verify]
command = "make check JOBS=2"

[merge]
# Green CI reports ready; operator or fast-forward lane lands explicitly.
automerge = false

[budget]
max_tokens_per_run = 200000
