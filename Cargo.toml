# Cargo.toml for kl (Kernel Layer Primitives)
# Host Throttling: Physical host ceres runs multiple active agent sessions.
# All cargo invocations (in Makefiles, Justfiles, scripts, and interactive runs)
# MUST specify -j 2 to prevent memory exhaustion and CPU starvation.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.85"
publish = false
license = "Apache-2.0 OR MIT OR CC0-1.0"
authors = ["Christian M. Todie <chris@todie.io>"]
repository = "https://github.com/unsigned-gg/kl"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
libc = "0.2"
landlock = "0.4.7"
seccompiler = "0.5.0"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
