$schema: https://projectfile.org/schema/v1.json
kind: SoftwareSourceCode

identity:
  namespace: gg.unsigned
  name: kl
  version: "0.1.0"
  title:
    en: "kl — Kernel Layer Primitives"
  summary:
    en: "Kernel link eBPF probes, priority clamping, and Landlock LSM confinement primitives in Rust."
  created: "2026-10-11"
  modified: "2026-11-16"

repositories:
  - url: "https://github.com/unsigned-gg/kl.git"
    type: git
    branch: main
    role: origin

links:
  - type: source-code
    url: https://github.com/unsigned-gg/kl
  - type: bugs
    url: https://github.com/unsigned-gg/kl/issues

license:
  spdx: Apache-2.0 OR MIT OR CC0-1.0
  file: LICENSE

copyright:
  year: 2026

people:
  - family-names: Todie
    given-names: Christian M.
    email: chris@todie.io
    roles: [founder, author, maintainer, copyright]

organizations:
  - name: "Unsigned"
    url: https://github.com/unsigned-gg
    roles: [funder, copyright, maintainer]

keywords:
  - ebpf
  - landlock
  - seccomp
  - kernel
  - confinement
  - rust

org.projectfile.ci:
  nodes:
    - id: zero-io-domain
      run: "! grep -rnE 'std::net|std::fs|tokio|std::process' crates/kl-domain/src"
    - id: fmt
      run: "cargo fmt --all -- --check"
    - id: clippy
      depends_on: [fmt, zero-io-domain]
      run: "cargo clippy --workspace -j 2 --all-targets -- -D warnings"
    - id: test
      depends_on: [clippy]
      run: "cargo test --workspace -j 2"
    - id: doc-test
      depends_on: [test]
      run: "cargo test --doc --workspace -j 2"
    - id: deny
      run: "cargo deny check"
